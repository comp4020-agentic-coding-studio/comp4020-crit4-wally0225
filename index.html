<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Sound Looper</title>
    <meta
      name="description"
      content="A browser instrument: ten keys make odd little sounds, and a looper layers up to five takes of what you play."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Random Sound Looper</h1>
      <p class="invite">Press a key to hear a sound.</p>

      <div class="keyboard" aria-label="Playable keys">
        <div class="key" data-key="q">Q</div>
        <div class="key" data-key="w">W</div>
        <div class="key" data-key="e">E</div>
        <div class="key" data-key="r">R</div>
        <div class="key" data-key="t">T</div>
        <div class="key" data-key="y">Y</div>
        <div class="key" data-key="u">U</div>
        <div class="key" data-key="i">I</div>
        <div class="key" data-key="o">O</div>
        <div class="key" data-key="p">P</div>
      </div>

      <div class="transport">
        <button id="record-btn" type="button">Record</button>
        <button id="clear-btn" type="button">Clear</button>
      </div>

      <div class="status" aria-live="polite">
        <div class="countdown" id="countdown" hidden></div>
        <div class="layers" id="layers">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <p class="hint">Space = Record / Overdub &middot; Delete = Clear</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
